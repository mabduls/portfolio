name: Deploy Portfolio Web Staging Pipeline

# 1. Kapan skrip ini dipicu? (Saat ada 'git push' ke branch develop atau main)
on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    # 2. Instruksikan GitHub untuk menggunakan Runner Lokal milikmu
    runs-on: self-hosted

    steps:
      # Step A: Ambil/Checkout kode terbaru dari repo GitHub ke laptop Ubuntu
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step B: Matikan & Hapus Container Lama (jika sedang berjalan) agar tidak bentrok port 3000
      - name: Stop Existing Container
        run: |
          docker stop vue-staging-app || true
          docker rm vue-staging-app || true

      # Step C: Build Docker Image Baru berdasarkan Dockerfile Fastify
      - name: Build Docker Image
        run: |
          docker build -t portfolio-web-staging-app:latest .

      # Step D: Jalankan Container Baru di Port 3000
      - name: Run New Docker Container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name portfolio-web-staging-app \
            --restart always \
            portfolio-web-staging-app:latest

      # Step E: Bersihkan Docker Image gantung (dangling image) biar disk space Ubuntu tidak penuh
      - name: Cleanup Old Docker Images
        run: |
          docker image prune -f